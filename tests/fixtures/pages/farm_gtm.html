<!--
  Fixture note. This is the page that justifies Playwright's existence.

  Static HTML carries the GTM container ID and nothing else. The GA4
  measurement ID G-V3H8N2QK4T exists only in the DOM after script execution,
  assembled from fragments so it appears nowhere in the source bytes — which
  is what a container-delivered tag looks like to an HTTP-only fetch.

  So: requests.get() on this page yields Google Tag Manager alone, a browser
  capture yields Google Tag Manager AND Google Analytics 4. That difference is
  the whole argument for the browser capture path, and it is measurable here
  rather than asserted.

  The real container loader (googletagmanager.com/gtm.js?id=...) is replaced by
  loadContainer() below: the fixture must never touch the network. Injection is
  synchronous at parse time rather than on a timer, so the result does not
  depend on how long a test happens to wait.
-->
<script>
  // Stands in for what gtm.js does once the container has loaded: push the
  // publisher's GA4 config tag into the page.
  function loadContainer(containerId) {
    var measurementId = ['G', 'V3H8N2QK4T'].join('-');
    var tag = document.createElement('script');
    tag.setAttribute('data-gtm-container', containerId);
    tag.textContent = "gtag('config', '" + measurementId + "');";
    document.head.appendChild(tag);
    window.__kwara_container_loaded = true;
  }
</script>

<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});
/* real snippet appends a script tag, src "https://www.googletagmanager.com/gtm.js?id="+i */
loadContainer(i);
})(window,document,'script','dataLayer','GTM-K7T2WQ9');</script>
<!-- End Google Tag Manager -->
</head>
