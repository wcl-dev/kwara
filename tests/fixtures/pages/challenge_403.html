<!--
  Fixture note. A Cloudflare-style interstitial, served with status 403.

  Two code paths care about it. _snapshot_worker._is_cf_blocked() scans the
  first 5000 bytes for the strings in _CF_SIGNALS, so those strings are
  present here and near the top; and adstxt / scanner record a non-200 rather
  than dropping it, because a WAF challenge on an ads.txt path is itself an
  OPSEC signal.

  The orchestrate script below is same-origin on purpose. A test that routes
  it can count the hit; a test that does not gets a harmless 404 from the
  fixture server. Nothing here leaves the loopback interface.
-->

          padding-top:1rem;margin-top:4rem}
</style>
</head>
